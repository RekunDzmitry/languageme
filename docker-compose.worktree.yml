# Self-contained Docker Compose for the `refactor/remove-ai-helper` worktree.
#
# Brings up Postgres + API + Vite frontend on host ports that don't collide
# with the main repo's `languageme` stack or the host's own Postgres (5432):
#   - Postgres  → localhost:5433
#   - API       → localhost:3001
#   - Frontend  → localhost:5174  (Vite dev server with /api proxy → api:3000)
#
# Containers are prefixed `rm-ai-` so `docker ps` shows which stack is which.
# All volumes are named (no host bind paths) so removing the stack is clean:
#
# Usage from the worktree root:
#   docker compose -f docker-compose.worktree.yml up -d --build
#   docker compose -f docker-compose.worktree.yml exec api npm run migrate
#   # open http://localhost:5174 in the browser
#
# Tear down (drops the named postgres volume too):
#   docker compose -f docker-compose.worktree.yml down -v
#
# AI provider: NVIDIA Nemotron by default. The AI helper chat is removed
# in this worktree, but the LLM service is still used by the Polish email
# evaluation route. If you want to exercise email evaluation, set
# NVIDIA_API_KEY in the environment before `up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rm-ai-postgres
    environment:
      POSTGRES_DB: languageme
      POSTGRES_USER: lm_user
      POSTGRES_PASSWORD: lm_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lm_user -d languageme"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rm-ai-net

  api:
    build: ./server
    container_name: rm-ai-api
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://lm_user:lm_pass@postgres:5432/languageme
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      PORT: 3000
      PUBLIC_URL: http://127.0.0.1:5174
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    volumes:
      # Hot-reload: any edit under server/src is picked up on the next request.
      # The image still owns node_modules so Vite/Express can run without a
      # second `npm install` in the container.
      - ./server/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rm-ai-net

  frontend:
    image: node:20-alpine
    container_name: rm-ai-frontend
    working_dir: /app
    ports:
      - "5174:5173"
    # Bind only the source files Vite needs so the named `node_modules`
    # volume below isn't shadowed by a stray node_modules/ in the source.
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Vite proxies /api/* → http://api:3000 inside the compose network.
      - API_URL=http://api:3000
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      - api
    networks:
      - rm-ai-net

networks:
  rm-ai-net:
    name: rm-ai-net

volumes:
  pgdata:
  frontend_node_modules:
