# Local dev override for the admin-panel worktree.
# - Reuses the already-running `languageme-postgres-1` from the main repo via
#   the `languageme_default` external network (no need to spin a second DB).
# - Mounts this worktree's source code so the new admin panel code is live.
# - Run from the worktree root:
#     docker compose -f docker-compose.local.yml up -d --build
#   Then open http://localhost:5173 (frontend) and http://localhost:3000 (api).

services:
  api:
    image: languageme-api
    # Image is pre-built by the main repo (./server). We only bind-mount the
    # worktree's src on top so the new admin code is live without rebuild.
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://lm_user:lm_pass@postgres:5432/languageme
      PUBLIC_URL: http://127.0.0.1:5173
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    volumes:
      # Hot-reload: source from this worktree is mounted in.
      - ./server/src:/app/src
    networks:
      - languageme_default

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_URL=http://api:3000
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    networks:
      - languageme_default
    depends_on:
      - api

networks:
  languageme_default:
    external: true
    name: languageme_default

volumes:
  frontend_node_modules:
